<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box in css</title>

    <style>
        .container{
            border: 2px solid black;
            height: 100vh;
            padding: 10px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            /* align-items: center; */
            flex-wrap: wrap;
            /* align-content: center; */
            /* flex-direction: column; */

            
        }
        .box{
            background-color: red;
            height: 50px;
            width: 50px;
            border: 2px solid black;
            color: white;
            font-size: 2rem;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
