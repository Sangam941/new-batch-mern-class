<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>symentic tags in html</title>
    <style>
      div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: aqua;
        padding: 0 10px;
      }

      ul {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      li {
        list-style-type: none;
      }
    </style>
  </head>
  <body>
    <!-- navigatioin bar -->

    <div>
      <h1>logo</h1>

      <ul>
        <li>home</li>
        <li>about</li>
      </ul>
    </div>

    <br />

    <div>
      <h1>about page</h1>
    </div>

    <br />
    <div>
      <h1>footer</h1>
    </div>

    <header>
      <nav>
        <h1>logo</h1>

        <ul>
          <li>home</li>
          <li>about</li>
        </ul>
      </nav>
    </header>

    <main>
        <section>
            this is about page/section
        </section>

        <section>
            this is home page/section
        </section>
    </main>


    <footer>this is footer</footer>





    <header>
        <nav></nav>
    </header>

    <main>
        <aside></aside>
        <section></section>
    </main>

    <footer>
        <div></div>
    </footer>

  </body>
</html>
